name: Backend checks
on:
  pull_request:
  push:
    branches: [main, feat/one-click-reliable-seckill]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/deploy.py up
      - run: python scripts/deploy.py test
      - name: Restore after service restart
        run: |
          docker compose restart order seckill
          docker compose up -d --wait --wait-timeout 120
          python scripts/deploy.py test
      - name: Broker outage preserves reservations
        run: |
          docker compose stop rabbitmq
          docker compose --profile test run --no-deps --rm -e BROKER_FAULT_STAGE=outage tests python -m pytest -q tests/test_faults.py
      - name: Broker recovery drains outbox
        run: |
          docker compose start rabbitmq
          docker compose up -d --wait --wait-timeout 120
          docker compose --profile test run --no-deps --rm -e BROKER_FAULT_STAGE=recovery tests python -m pytest -q tests/test_faults.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Cleanup
        if: always()
        run: docker compose down --volumes
